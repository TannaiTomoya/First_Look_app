{% extends "base.html" %}

{% block title %}メニュー作成 - FirstLook{% endblock %}

{% block content %}
<div class="container mt-4">
    <h1 class="mb-4">メニュー作成</h1>
    
    <form method="POST" action="{{ url_for('coach.create_menu') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        <div class="mb-3">
            <label for="title" class="form-label">メニュータイトル</label>
            <input type="text" class="form-control" id="title" name="title" required>
            <small class="form-text text-muted">例: 面接対策プラン</small>
        </div>
        
        <div class="mb-3">
            <label for="description" class="form-label">メニュー内容</label>
            <textarea class="form-control" id="description" name="description" rows="4"></textarea>
            <small class="form-text text-muted">メニューの詳細を記載してください</small>
        </div>
        
        <div class="mb-3">
            <label for="price" class="form-label">価格（円）</label>
            <input type="number" class="form-control" id="price" name="price" min="0" required>
        </div>
        
        <div class="mb-3">
            <label for="duration" class="form-label">所要時間（分）</label>
            <input type="number" class="form-control" id="duration" name="duration" min="0" required>
            <small class="form-text text-muted">例: 60, 90, 120</small>
        </div>
        
        <button type="submit" class="btn btn-primary">作成</button>
        <a href="{{ url_for('coach.dashboard') }}" class="btn btn-secondary">キャンセル</a>
    </form>
</div>
{% endblock %}
