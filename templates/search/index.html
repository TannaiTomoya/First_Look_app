{% extends "base.html" %}

{% block title %}検索 - PhotoShare{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <!-- 検索ヘッダー -->
            <div class="text-center mb-5 mt-4">
                <i class="fas fa-search fa-3x text-primary mb-3"></i>
                <h1 class="h2 fw-bold mb-2">検索</h1>
                <p class="text-muted">ユーザー、投稿、ハッシュタグを検索</p>
            </div>

            <!-- 検索フォーム -->
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-body p-4">
                    <form method="GET" action="{{ url_for('search.results') }}">
                        <div class="input-group input-group-lg">
                            <span class="input-group-text bg-white border-end-0">
                                <i class="fas fa-search text-muted"></i>
                            </span>
                            <input 
                                type="text" 
                                name="q" 
                                class="form-control border-start-0 ps-0" 
                                placeholder="ユーザー名、キャプション、ハッシュタグで検索..."
                                autofocus
                            >
                            <button type="submit" class="btn btn-primary px-4">
                                検索
                            </button>
                        </div>
                        <div class="form-text mt-2">
                            <i class="fas fa-info-circle"></i> 
                            例: <code>@username</code>, <code>風景</code>, <code>#旅行</code>
                        </div>
                    </form>
                </div>
            </div>

            <!-- 検索のヒント -->
            <div class="row g-3">
                <div class="col-md-4">
                    <div class="card border-0 shadow-sm h-100">
                        <div class="card-body text-center p-4">
                            <i class="fas fa-user fa-2x text-primary mb-3"></i>
                            <h5 class="h6 fw-bold">ユーザー検索</h5>
                            <p class="text-muted small mb-0">
                                ユーザー名で検索できます
                            </p>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card border-0 shadow-sm h-100">
                        <div class="card-body text-center p-4">
                            <i class="fas fa-pen fa-2x text-success mb-3"></i>
                            <h5 class="h6 fw-bold">キャプション検索</h5>
                            <p class="text-muted small mb-0">
                                投稿の説明文から検索
                            </p>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card border-0 shadow-sm h-100">
                        <div class="card-body text-center p-4">
                            <i class="fas fa-hashtag fa-2x text-info mb-3"></i>
                            <h5 class="h6 fw-bold">ハッシュタグ検索</h5>
                            <p class="text-muted small mb-0">
                                #付きでも#なしでもOK
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
