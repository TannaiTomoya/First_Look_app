{% extends "base.html" %}

{% block title %}準備完了 - FirstLook{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center align-items-center" style="min-height: 80vh;">
        <div class="col-md-6 text-center">
            <div class="mb-4">
                <i class="fas fa-check-circle text-success" style="font-size: 5rem;"></i>
            </div>
            <h1 class="display-4 mb-3">準備完了</h1>
            <p class="lead text-muted mb-4">
                これで変化の記録が始まります
            </p>
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="text-muted mt-3">
                <small>ダッシュボードに移動しています...</small>
            </p>
            
            <!-- Secondary CTA : Skin Check -->
            <div class="card mt-4 border-0 shadow-sm">
                <div class="card-body text-center py-4 px-4">
                    
                    <h5 class="fw-bold mb-2">
                        肌状態もチェックしますか？
                    </h5>

                    <p class="text-muted small mb-3">
                        今の肌状態を分析して改善ポイントを表示できます。
                    </p>

                    <a href="{{ url_for('client.skin_check') }}"
                       class="btn btn-outline-primary btn-sm px-4"
                       onclick="cancelAutoRedirect(event)">
                        肌診断を試す
                    </a>

                </div>
            </div>
        </div>
    </div>
</div>

<script>
// 自動遷移タイマー
let autoRedirectTimer = setTimeout(() => {
    window.location.href = '/client/dashboard';
}, 1500);

// 肌診断ボタンクリック時は自動遷移をキャンセル
function cancelAutoRedirect(event) {
    clearTimeout(autoRedirectTimer);
    // リンクの通常動作は継続（/client/skin-check に遷移）
}
</script>
{% endblock %}
