<!-- フォーカスモードフッター（逃げ道リンク） -->
<div class="text-center mt-5 pt-5">
    <button id="revealToolsBtn" class="btn btn-link text-muted small">
        <i class="fas fa-chevron-down"></i> 他の機能を見る
    </button>
</div>

<script>
document.getElementById("revealToolsBtn").onclick = () => {
    // 同一セッションで1回だけconfirmを表示
    const confirmed = sessionStorage.getItem("focus_tools_confirmed");
    
    if (!confirmed) {
        const ok = confirm("今日はまだ記録がありません。先に1枚撮るのがおすすめです。続けますか？");
        if (!ok) return;
        sessionStorage.setItem("focus_tools_confirmed", "1");
    }
    
    // イベント記録（非同期・非ブロッキング）
    try {
        const payload = JSON.stringify({event: "dashboard_tools_override_clicked"});
        if (navigator.sendBeacon) {
            navigator.sendBeacon("/client/api/event", payload);
        } else {
            fetch("/client/api/event", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: payload,
                keepalive: true
            }).catch(() => {}); // サイレントエラー
        }
    } catch(e) {}
    
    // 遷移
    window.location.href = "/client/dashboard?tools=1";
};
</script>
